<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fitoplancton abisal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
#cameraPreview{position:fixed;right:12px;top:12px;width:190px;max-width:32vw;aspect-ratio:4/3;object-fit:cover;transform:scaleX(-1);opacity:.65;border:1px solid #7ff3dc55;z-index:3;pointer-events:none;display:none}
#cameraPreview.visible{display:block}
#trackStatus{color:#7ff3dc;max-width:300px}
/* Layout: lienzo a sangre completa, una franja mínima de control flotando abajo a la izquierda */
:root{
  --abismo:#02080d; --agua:#06222b; --biolum:#7ff3dc; --clorofila:#9fd36a; --tinta:#cfe6e4; --tenue:#5d8389;
  --display:"Fraunces", Georgia, serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--abismo);color:var(--tinta);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:fixed;left:0;bottom:0;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));max-width:100%;pointer-events:none}
.hud h1{font:300 clamp(22px,4vw,34px)/1 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.hud p{font:400 11px/1.5 var(--mono);color:var(--tenue);margin:0;letter-spacing:.06em;text-transform:uppercase}
.ctl{display:flex;flex-wrap:wrap;gap:8px 18px;pointer-events:auto;font:400 11px var(--mono);color:var(--tenue);letter-spacing:.05em}
.ctl label{display:flex;align-items:center;gap:8px}
.ctl input[type=range]{width:96px;accent-color:var(--biolum)}
.ctl button{font:inherit;color:var(--tinta);background:transparent;border:1px solid var(--tenue);padding:4px 10px;cursor:pointer;letter-spacing:.08em}
.ctl button:focus-visible,.ctl input:focus-visible{outline:1px solid var(--biolum);outline-offset:2px}
#prof{font-variant-numeric:tabular-nums;color:var(--biolum)}
.hud{transition:opacity .6s ease}
.sincursor canvas{cursor:none}
.limpio .hud{opacity:0}
.limpio .ctl{pointer-events:none}
.atajo{color:var(--tenue);opacity:.7}
</style>

<video id="cameraPreview" autoplay muted playsinline></video>
<canvas id="c" aria-label="Simulación de fitoplancton y fondo marino"></canvas>
<div class="hud">
  <h1>Fitoplancton abisal</h1>
  <p>profundidad <span id="prof">−212 m</span> · tocá el agua para excitar la bioluminiscencia</p>
  <div class="ctl">
    <label for="dens">densidad <input id="dens" type="range" min="200" max="2400" value="1100"></label>
    <label for="corr">corriente <input id="corr" type="range" min="0" max="100" value="35"></label>
    <label for="turb">turbidez <input id="turb" type="range" min="0" max="100" value="20"></label>
    <label for="luz">luz cenital <input id="luz" type="range" min="0" max="100" value="55"></label>
    <label for="blur">difuminado <input id="blur" type="range" min="0" max="30" value="9"></label>
    <label for="cont">contagio <input id="cont" type="range" min="0" max="100" value="25"></label>
    <label for="vida">vida <input id="vida" type="range" min="4" max="121" value="45"> <span id="vidaV">45 s</span></label>
    <button id="tracking" type="button">activar cámara / mano</button>
    <button id="preview" type="button">ver cámara</button>
    <label for="borde">borde <input id="borde" type="range" min="15" max="85" value="50"></label>
    <label for="seguimiento">adherencia <input id="seguimiento" type="range" min="0" max="100" value="76"></label>
    <span id="trackStatus" aria-live="polite">cámara desactivada</span>
    <button id="cur" type="button">ocultar cursor</button>
    <button id="hud" type="button">ocultar interfaz</button>
    <button id="fs" type="button">pantalla completa</button>
    <span class="atajo">teclas C · H · doble clic vuelve la interfaz</span>
  </div>
</div>

<script>
const cv=document.getElementById('c');let ctx=cv.getContext('2d');const main=ctx;
const layer=document.createElement('canvas');const lctx=layer.getContext('2d');
const soft=document.createElement('canvas');const sctx=soft.getContext('2d');
const hasFilter=typeof main.filter==='string';
let W,H,DPR,floorY,sand,time=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);

// ruido suave 1D/2D barato
const P=new Uint8Array(512);for(let i=0;i<256;i++)P[i]=i;for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0;[P[i],P[j]]=[P[j],P[i]]}for(let i=0;i<256;i++)P[i+256]=P[i];
const fade=t=>t*t*t*(t*(t*6-15)+10),lerp=(a,b,t)=>a+(b-a)*t;
function grad(h,x,y){const g=h&3;return((g&1)?-x:x)+((g&2)?-y:y)}
function noise(x,y){const X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);const u=fade(x),v=fade(y);
  const a=P[X]+Y,b=P[X+1]+Y;return lerp(lerp(grad(P[a],x,y),grad(P[b],x-1,y),u),lerp(grad(P[a+1],x,y-1),grad(P[b+1],x-1,y-1),u),v)}

// tipos de fitoplancton
const TIPOS=['diatomea_c','diatomea_p','dino','coco','cadena'];
let cells=[],snow=[],pulses=[],weeds=[],restos=[],lodo=[];
let turbG=0;
// La cámara entrega 21 puntos anatómicos. Los organismos se adhieren a segmentos de la mano.
const handState={points:[],active:false,lastSeen:0,everCrossed:false};
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
window.handBridge={update(landmarks){
  if(!landmarks?.length){if(performance.now()-handState.lastSeen>400)handState.active=false;return;}
  const pts=landmarks.map(p=>({x:(1-p.x)*W,y:p.y*H}));
  handState.points=pts;handState.lastSeen=performance.now();
  // El borde funciona como umbral: si un dedo cruza hacia la derecha, se activa.
  const bx=W*(+$('borde').value/100);
  const crossed=[4,8,12,16,20].some(i=>pts[i]&&pts[i].x>=bx);
  if(crossed&&!handState.active)poke(pts[8].x,pts[8].y,.65);
  handState.active=crossed;
},stop(){handState.points=[];handState.active=false}};
function handTarget(index){
  const bone=BONES[index%BONES.length],a=handState.points[bone[0]],b=handState.points[bone[1]];
  if(!a||!b)return null;
  const t=((index*0.61803398875)%1);
  return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
}
// vida en segundos; el tope del slider equivale a inmortal
const vidaSeg=()=>{const v=+$('vida').value;return v>=121?Infinity:v};

function mkCell(){
  const t=TIPOS[Math.random()*TIPOS.length|0];
  const depth=Math.random();
  const c={t,x:rnd(0,W),y:rnd(0,floorY),z:depth,// z: 0 lejos, 1 cerca
    s:(t==='cadena'?rnd(2.5,4):rnd(1.6,4.2))*(0.45+depth*0.9),
    rot:rnd(0,Math.PI*2),vr:rnd(-.01,.01),ph:rnd(0,1e3),glow:0,
    hue:t==='dino'?rnd(160,185):t==='coco'?rnd(55,90):rnd(70,120),
    n:t==='cadena'?(rnd(3,7)|0):t==='diatomea_c'?(rnd(8,14)|0):0};
  // forma previa (para la metamorfosis), tono objetivo, longevidad individual y edad inicial escalonada
  c.t0=c.t;c.n0=c.n;c.m=1;c.hT=c.hue;c.lf=rnd(.6,1.4);
  c.age=rnd(0,.9)*c.lf*Math.min(vidaSeg(),60)*60;
  return c;
}
function mkLodo(){return{x:rnd(0,W),y:rnd(floorY*.25,floorY+10),r:rnd(.5,2.4),ph:rnd(0,9)}}

// muerte: el cuerpo cae como resto orgánico y el lugar lo ocupa una célula nueva,
// muchas veces hija por división de otra (hereda su forma)
function morir(c){
  if(restos.length<700)restos.push({x:c.x,y:c.y,r:Math.max(.6,c.s*.35),v:rnd(.25,.6),a:.5,h:c.hue});
  const nc=mkCell();
  if(Math.random()<.6&&cells.length>1){const p=cells[Math.random()*cells.length|0];
    nc.t=nc.t0=p.t;nc.n=nc.n0=p.n;nc.hue=nc.hT=p.hT;
    nc.x=p.x+rnd(-14,14);nc.y=p.y+rnd(-14,14);nc.z=Math.min(1,Math.max(0,p.z+rnd(-.05,.05)));nc.s=p.s*rnd(.85,1.1)}
  nc.age=0;Object.assign(c,nc);
}
function vitalidad(c,vs){
  const fin=Math.min(1,c.age/90);if(vs===Infinity)return fin;
  const life=c.lf*vs*60;return fin*Math.max(0,Math.min(1,(life-c.age)/Math.min(120,life*.25)));
}

// contagio: una célula cercana (a profundidad parecida) puede adoptar la forma de su vecina
function infectar(c,o){c.t0=c.t;c.n0=c.n;c.t=o.t;c.n=o.n;c.hT=o.hT;c.m=0;c.glow=Math.max(c.glow,.35)}
function contagiar(k){
  if(k<=0||cells.length<2)return;
  const G=36,cols=Math.ceil(W/G)+3,grid=new Map();
  for(const c of cells){const key=((c.x/G|0)+1)+((c.y/G|0)+1)*cols;let b=grid.get(key);if(!b)grid.set(key,b=[]);b.push(c)}
  const intentos=Math.min(cells.length,60+k*400|0);
  for(let i=0;i<intentos;i++){const c=cells[Math.random()*cells.length|0];if(c.m<1)continue;
    const gx=(c.x/G|0)+1,gy=(c.y/G|0)+1;
    busca:for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const b=grid.get(gx+dx+(gy+dy)*cols);if(!b)continue;
      for(const o of b){if(o===c||o.t===c.t||Math.abs(o.z-c.z)>.25)continue;
        if(Math.hypot(o.x-c.x,o.y-c.y)<G&&Math.random()<k*k*.5){infectar(c,o);break busca}}}}
}
function mkSnow(){return{x:rnd(0,W),y:rnd(-H,floorY),r:rnd(.4,1.8),v:rnd(.08,.35),w:rnd(0,6)}}

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  layer.width=W*DPR;layer.height=H*DPR;lctx.setTransform(DPR,0,0,DPR,0,0);
  soft.width=Math.ceil(W/4);soft.height=Math.ceil(H/4);
  floorY=H*0.78;
  buildFloor();
  const n=+$('dens').value;cells=Array.from({length:n},mkCell);
  snow=Array.from({length:Math.round(W*H/2600)},mkSnow);
  lodo=Array.from({length:Math.round(W*H/900)},mkLodo);restos=[];
  weeds=Array.from({length:Math.round(W/38)},()=>({x:rnd(0,W),h:rnd(18,70),seg:(rnd(5,10)|0),ph:rnd(0,9),c:rnd(0,1)}));
}

// fondo marino pre-renderizado: sedimento, ripples, piedras, diatomeas muertas
function buildFloor(){
  sand=document.createElement('canvas');sand.width=W*DPR;sand.height=H*DPR;
  const g=sand.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  const top=x=>floorY+noise(x*.004,1.3)*26+noise(x*.02,4)*5;
  g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=4)g.lineTo(x,top(x));g.lineTo(W,H);g.closePath();
  const gr=g.createLinearGradient(0,floorY-30,0,H);gr.addColorStop(0,'#123139');gr.addColorStop(.35,'#0a1f25');gr.addColorStop(1,'#040d10');
  g.fillStyle=gr;g.fill();g.save();g.clip();
  // ondulitas de arena
  for(let i=0;i<70;i++){const y0=rnd(floorY,H);g.beginPath();
    for(let x=0;x<=W;x+=6){const y=y0+Math.sin(x*.035+i)*2+noise(x*.01,i)*6;x?g.lineTo(x,y):g.moveTo(x,y)}
    g.strokeStyle=`rgba(120,170,170,${rnd(.02,.06)})`;g.lineWidth=rnd(.5,1.4);g.stroke()}
  // grano
  for(let i=0;i<W*H*.012;i++){const x=rnd(0,W),y=rnd(floorY-20,H);if(y<top(x))continue;
    g.fillStyle=`rgba(${rnd(120,200)|0},${rnd(170,210)|0},${rnd(170,200)|0},${rnd(.03,.12)})`;g.fillRect(x,y,1,1)}
  // piedras y valvas
  for(let i=0;i<W/28;i++){const x=rnd(0,W),y=top(x)+rnd(4,(H-floorY)*.8),r=rnd(3,16)*(0.5+(y-floorY)/(H-floorY));
    g.beginPath();g.ellipse(x,y,r,r*rnd(.4,.6),rnd(-.3,.3),0,7);g.fillStyle=`rgba(20,45,50,${rnd(.6,.9)})`;g.fill();
    g.beginPath();g.ellipse(x-r*.2,y-r*.18,r*.6,r*.18,0,0,7);g.fillStyle='rgba(140,200,200,.05)';g.fill()}
  for(let i=0;i<W/14;i++){const x=rnd(0,W),y=top(x)+rnd(2,(H-floorY)*.9),r=rnd(1.2,3.5);
    g.beginPath();g.arc(x,y,r,0,7);g.strokeStyle='rgba(180,220,200,.12)';g.lineWidth=.6;g.stroke();
    for(let k=0;k<6;k++){const a=k/6*Math.PI*2;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.stroke()}}
  g.restore();
  sand.top=top;
}

function drawCell(c,a){
  const L=Math.min(1,c.glow);
  const lum=55+c.z*14;
  const edge=`hsla(${c.hue},70%,82%,${a*.6})`;
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
  // relleno translúcido tipo vidrio: centro casi transparente, borde más denso
  const R=c.s*(c.t==='diatomea_p'?2.9:c.t==='dino'?3:c.t==='cadena'?1.4:1.8);
  const base=ctx.createRadialGradient(-c.s*.3,-c.s*.3,0,0,0,R);
  base.addColorStop(0,`hsla(${c.hue},60%,${lum+20}%,${a*.07})`);
  base.addColorStop(.65,`hsla(${c.hue},55%,${lum}%,${a*.18})`);
  base.addColorStop(1,`hsla(${c.hue},55%,${lum}%,${a*.38})`);
  if(L>.02){ctx.globalCompositeOperation='lighter';
    const r=c.s*(6+L*10)*(1+turbG*.6);const gg=ctx.createRadialGradient(0,0,0,0,0,r);
    gg.addColorStop(0,`rgba(127,243,220,${.55*L})`);gg.addColorStop(1,'rgba(127,243,220,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.globalCompositeOperation='source-over'}
  ctx.lineWidth=Math.max(.4,c.s*.18);ctx.strokeStyle=edge;ctx.fillStyle=base;const s=c.s;
  if(c.m>=1)forma(c.t,s,c.n,c);
  else{// metamorfosis: la forma vieja se contrae y se apaga mientras la nueva crece
    const m=fade(c.m);
    ctx.save();ctx.globalAlpha=1-m;ctx.scale(1-m*.35,1-m*.35);forma(c.t0,s,c.n0,c);ctx.restore();
    ctx.save();ctx.globalAlpha=m;const k=.65+m*.35;ctx.scale(k,k);forma(c.t,s,c.n,c);ctx.restore()}
  ctx.restore();
}

function forma(t,s,n,c){
  switch(t){
    case 'diatomea_c': // céntrica: disco con estrías radiales
      ctx.beginPath();ctx.arc(0,0,s*1.6,0,7);ctx.fill();ctx.stroke();
      if(s>2){ctx.beginPath();for(let i=0;i<n;i++){const an=i/n*Math.PI*2;ctx.moveTo(Math.cos(an)*s*.5,Math.sin(an)*s*.5);ctx.lineTo(Math.cos(an)*s*1.5,Math.sin(an)*s*1.5)}ctx.lineWidth=.35;ctx.stroke()}break;
    case 'diatomea_p': // pennada: navícula
      ctx.beginPath();ctx.ellipse(0,0,s*2.8,s*.7,0,0,7);ctx.fill();ctx.stroke();
      if(s>2){ctx.beginPath();ctx.moveTo(-s*2.4,0);ctx.lineTo(s*2.4,0);ctx.lineWidth=.35;ctx.stroke()}break;
    case 'dino': // dinoflagelado con cuernos y flagelo
      ctx.beginPath();ctx.moveTo(0,-s*3);ctx.quadraticCurveTo(s*1.4,-s*.6,s*1.2,s*.6);ctx.lineTo(s*.9,s*2.6);
      ctx.lineTo(s*.2,s*1.1);ctx.lineTo(-s*.6,s*2);ctx.quadraticCurveTo(-s*1.5,0,0,-s*3);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(-s*1.2,0);ctx.lineTo(s*1.2,0);ctx.lineWidth=.4;ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,s*1);for(let i=1;i<6;i++)ctx.lineTo(Math.sin(time*.2+c.ph+i)*s*.6,s+i*s*.7);ctx.stroke();break;
    case 'coco': // cocolitofórido: esfera con placas
      ctx.beginPath();ctx.arc(0,0,s*1.3,0,7);ctx.fill();
      for(let i=0;i<7;i++){const an=i/7*Math.PI*2;ctx.beginPath();ctx.ellipse(Math.cos(an)*s*1.2,Math.sin(an)*s*1.2,s*.55,s*.32,an,0,7);ctx.stroke()}break;
    case 'cadena': // cadena de células (Chaetoceros) con setas
      for(let i=0;i<n;i++){const x=(i-(n-1)/2)*s*1.9+Math.sin(time*.02+c.ph+i)*s*.15;
        ctx.beginPath();ctx.rect(x-s*.8,-s*.6,s*1.6,s*1.2);ctx.fill();ctx.stroke();
        if(s>2.4){ctx.beginPath();ctx.moveTo(x,-s*.6);ctx.lineTo(x+s*1.2,-s*3);ctx.moveTo(x,s*.6);ctx.lineTo(x-s*1.2,s*3);ctx.lineWidth=.3;ctx.stroke()}}break;
  }
}

let ptr={x:-999,y:-999,down:false,px:0,py:0};
function poke(x,y,f=1){pulses.push({x,y,r:0,a:1*f});for(const c of cells){const d=Math.hypot(c.x-x,c.y-y);if(d<120*f)c.glow=Math.max(c.glow,1.2-d/(120*f))}}
cv.addEventListener('pointerdown',e=>{ptr.down=true;ptr.x=e.clientX;ptr.y=e.clientY;poke(e.clientX,e.clientY,1.4)});
addEventListener('pointerup',()=>ptr.down=false);
cv.addEventListener('pointermove',e=>{ptr.px=ptr.x;ptr.py=ptr.y;ptr.x=e.clientX;ptr.y=e.clientY;
  const sp=Math.hypot(ptr.x-ptr.px,ptr.y-ptr.py);if(sp>6||ptr.down)for(const c of cells){const d=Math.hypot(c.x-ptr.x,c.y-ptr.y);if(d<50)c.glow=Math.max(c.glow,(1-d/50)*Math.min(1,sp/25+(ptr.down?.6:0)))}});
cv.addEventListener('pointerleave',()=>{ptr.x=ptr.y=-999});

$('dens').addEventListener('input',e=>{const n=+e.target.value;while(cells.length<n)cells.push(mkCell());cells.length=n});
$('vida').addEventListener('input',e=>{const v=+e.target.value;$('vidaV').textContent=v>=121?'∞':v+' s'});
$('fs').addEventListener('click',()=>{const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen?.())?.catch?.(()=>{})});

function frame(){
  time+=reduce?.2:1;
  const cur=+$('corr').value/100, luz=+$('luz').value/100;
  const turb=+$('turb').value/100, cont=+$('cont').value/100, vs=vidaSeg(), dt=reduce?.2:1;
  turbG=turb;
  // la turbidez vuelve la corriente racheada
  const gust=1+turb*.8*noise(time*.004,7.3);
  // agua (con turbidez vira hacia un verde limoso)
  const bg=ctx.createLinearGradient(0,0,0,H);
  const tm=turb*.7,r0=8+luz*14,g0=40+luz*50,b0=52+luz*50;
  bg.addColorStop(0,`rgb(${lerp(r0,38+luz*30,tm)|0},${lerp(g0,50+luz*34,tm)|0},${lerp(b0,34+luz*18,tm)|0})`);bg.addColorStop(.55,'#062029');bg.addColorStop(1,'#020a0e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // haces de luz cenital
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){const x=W*(i/6)+Math.sin(time*.003+i*2)*W*.08,w=W*(.04+((i*37)%5)*.012);
    const g=ctx.createLinearGradient(0,0,0,floorY);g.addColorStop(0,`rgba(140,230,220,${.07*luz*(1+turb*.6)})`);g.addColorStop(Math.max(.25,1-turb*.7),'rgba(140,230,220,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-w*.3,0);ctx.lineTo(x+w*.3,0);ctx.lineTo(x+w*2+W*.05,floorY);ctx.lineTo(x-w+W*.05,floorY);ctx.fill()}
  ctx.globalCompositeOperation='source-over';
  // fondo
  ctx.drawImage(sand,0,0,W,H);
  const blurPx=+$('blur').value/10+turb*1.4;
  // algas/esponjas en el borde del sedimento
  for(const w of weeds){let x=w.x,y=sand.top(w.x)+3;ctx.beginPath();ctx.moveTo(x,y);
    for(let k=1;k<=w.seg;k++){x+=Math.sin(time*.012+w.ph+k*.5)*(1.2+cur*3)*k/w.seg+cur*.6;y-=w.h/w.seg;ctx.lineTo(x,y)}
    ctx.strokeStyle=w.c<.5?'rgba(80,140,110,.35)':'rgba(150,120,90,.28)';ctx.lineWidth=1.2;ctx.stroke()}
  // nieve marina
  for(const s of snow){s.y+=s.v;s.x+=Math.sin(time*.01+s.w)*.15+cur*.4;
    if(s.y>sand.top((s.x%W+W)%W)){s.y=rnd(-40,0);s.x=rnd(0,W)}if(s.x>W)s.x-=W;if(s.x<0)s.x+=W;
    ctx.fillStyle=`rgba(200,230,225,${.15+s.r*.12})`;ctx.fillRect(s.x,s.y,s.r,s.r)}
  // restos de células muertas hundiéndose
  for(let i=restos.length-1;i>=0;i--){const r=restos[i];r.y+=r.v*dt;r.x+=cur*.4+Math.sin(time*.02+i)*.1;r.a*=.998;
    if(r.y>sand.top((r.x%W+W)%W)||r.a<.03){restos.splice(i,1);continue}
    ctx.fillStyle=`hsla(${r.h},40%,70%,${r.a})`;ctx.fillRect(r.x,r.y,r.r,r.r)}
  // sedimento resuspendido por la turbidez
  const nl=lodo.length*turb|0;
  for(let i=0;i<nl;i++){const l=lodo[i];const q=noise(l.x*.006+time*.003,l.y*.006+l.ph);
    l.x+=cur*.9*gust+Math.cos(q*Math.PI*2)*turb*1.5;l.y+=Math.sin(q*Math.PI*2)*.6*turb+.05;
    if(l.x>W)l.x-=W;if(l.x<0)l.x+=W;
    if(l.y>sand.top(l.x)||l.y<0){l.y=sand.top(l.x)-rnd(0,40);l.x=rnd(0,W)}
    ctx.fillStyle=`rgba(150,140,100,${.06+l.r*.07*turb})`;ctx.fillRect(l.x,l.y,l.r,l.r)}
  // Umbral de activación y trazado delicado del contorno de la mano
  const borderX=W*(+$('borde').value/100);
  ctx.save();ctx.setLineDash([3,9]);ctx.beginPath();ctx.moveTo(borderX,0);ctx.lineTo(borderX,H);
  ctx.strokeStyle=handState.active?'rgba(127,243,220,.48)':'rgba(127,243,220,.20)';ctx.lineWidth=1;ctx.stroke();ctx.restore();
  if(handState.active && handState.points.length===21){
    ctx.save();ctx.strokeStyle='rgba(127,243,220,.14)';ctx.lineWidth=.85;
    for(const [i,j] of BONES){const a=handState.points[i],b=handState.points[j];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
    ctx.restore();
  }
  // fitoplancton: ordenado por profundidad
  for(let ci=0;ci<cells.length;ci++){
    const c=cells[ci];
    const n=noise(c.x*.003+time*.0015,c.y*.003);
    const n2=turb>0?noise(c.x*.012+time*.006,c.y*.012+50):0;
    c.x+=(cur*1.1*gust+Math.cos(n*Math.PI*2)*(.25+turb*.6)+Math.cos(n2*Math.PI*2)*turb*.9)*(.3+c.z*.9);
    c.y+=(Math.sin(n*Math.PI*2)*(.22+turb*.5)+Math.sin(n2*Math.PI*2)*turb*.7)*(.3+c.z)+.02;
    // Parte del ecosistema se adhiere a dedos y palma en lugar de formar una masa.
    if(handState.active && ci%4===0){
      const target=handTarget(ci),strength=(+$('seguimiento').value/100);
      if(target){
        const dx=target.x-c.x,dy=target.y-c.y;
        const k=(.008+.045*strength)*(0.65+c.z*.4);
        c.x+=dx*k;c.y+=dy*k;
        if(Math.hypot(dx,dy)<110){c.glow=Math.max(c.glow,.24+strength*.42);}
      }
    }
    c.rot+=c.vr*(1+turb*2);c.glow*=.965;
    if(Math.random()<.00015)c.glow=.6; // destello espontáneo
    if(c.x>W+20)c.x=-20;if(c.x<-20)c.x=W+20;if(c.y<-20)c.y=floorY-10;
    if(c.y>sand.top((c.x%W+W)%W)-4)c.y-=1.5;
    // metamorfosis en curso y deriva del tono hacia el de la forma adoptada
    if(c.m<1)c.m=Math.min(1,c.m+.012*dt);
    c.hue+=(c.hT-c.hue)*.03;
    // envejecimiento
    c.age+=dt;
    if(vs!==Infinity&&c.age>=c.lf*vs*60)morir(c);
  }
  contagiar(cont);
  cells.sort((a,b)=>a.z-b.z);
  // las células se dibujan en una capa aparte y se componen con difuminado
  lctx.clearRect(0,0,W,H);ctx=lctx;
  for(const c of cells){const fogA=(.22+c.z*.7)*(1-turb*.55*(1-c.z))*vitalidad(c,vs);if(fogA>.005)drawCell(c,fogA)}
  ctx=main;
  if(blurPx>0&&hasFilter){main.filter=`blur(${blurPx}px)`;main.drawImage(layer,0,0,W,H);main.filter='none';
    main.globalAlpha=.35;main.drawImage(layer,0,0,W,H);main.globalAlpha=1}
  else if(blurPx>0){sctx.clearRect(0,0,soft.width,soft.height);sctx.drawImage(layer,0,0,soft.width,soft.height);
    main.globalAlpha=Math.max(.4,1-blurPx/4);main.drawImage(layer,0,0,W,H);
    main.globalAlpha=Math.min(.8,blurPx/3);main.imageSmoothingQuality='high';main.drawImage(soft,0,0,W,H);main.globalAlpha=1}
  else main.drawImage(layer,0,0,W,H);
  // velo de turbidez, más denso hacia el fondo
  if(turb>0){const f=ctx.createLinearGradient(0,0,0,H);
    f.addColorStop(0,`rgba(30,45,35,${turb*.25})`);f.addColorStop(1,`rgba(45,50,35,${turb*.55})`);
    ctx.fillStyle=f;ctx.fillRect(0,0,W,H)}
  // ondas de perturbación
  ctx.globalCompositeOperation='lighter';
  for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.r+=3;p.a*=.94;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.strokeStyle=`rgba(127,243,220,${p.a*.35})`;ctx.lineWidth=1;ctx.stroke();
    if(p.a<.02)pulses.splice(i,1)}
  ctx.globalCompositeOperation='source-over';
  // viñeta
  const v=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.25,W/2,H*.5,Math.max(W,H)*.8);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,4,6,.75)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  $('prof').textContent='−'+Math.round(212+Math.sin(time*.001)*6+(1-luz)*180)+' m';
  requestAnimationFrame(frame);
}
const root=document.documentElement;
function toggleCursor(){const on=root.classList.toggle('sincursor');$('cur').textContent=on?'mostrar cursor':'ocultar cursor'}
function toggleHud(){root.classList.toggle('limpio')}
$('cur').addEventListener('click',toggleCursor);
$('hud').addEventListener('click',()=>{toggleHud();if(!root.classList.contains('sincursor'))toggleCursor()});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.key!=='Escape')return;
  const k=e.key.toLowerCase();if(k==='c')toggleCursor();else if(k==='h')toggleHud();else if(k==='escape'){root.classList.remove('limpio','sincursor');$('cur').textContent='ocultar cursor'}});
cv.addEventListener('dblclick',()=>{root.classList.remove('limpio')});
addEventListener('resize',resize);
resize();
// estado inicial con algo de luz ya encendida
for(let i=0;i<4;i++)poke(rnd(W*.2,W*.8),rnd(H*.2,floorY*.9),.8);
frame();
</script>
<script type="module">
// MediaPipe Hand Landmarker. Requiere HTTPS o localhost y acceso a internet la primera vez.
const status=document.getElementById('trackStatus');
const button=document.getElementById('tracking');
const video=document.getElementById('cameraPreview');
let stream,landmarker,running=false,rafId=0,lastVideoTime=-1;
document.getElementById('preview').onclick=()=>video.classList.toggle('visible');
async function start(){
  button.disabled=true;status.textContent='solicitando acceso a cámara…';
  try{
    if(location.protocol==='file:')throw new Error('Este archivo está abierto desde Descargas (file://). Para usar la cámara y el detector publicalo en GitHub Pages (HTTPS) o ejecutalo en localhost.');
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('Se requiere HTTPS o localhost');
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
    video.srcObject=stream;await video.play();
    status.textContent='cargando detección de mano…';
    // Varios orígenes por si un CDN bloquea la importación.
    const versions=[
      ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'],
      ['https://esm.sh/@mediapipe/tasks-vision@0.10.14','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm']
    ];
    let library=null, wasmUrl='';
    for(const [url,wasm] of versions){try{library=await import(url);if(library.HandLandmarker&&library.FilesetResolver){wasmUrl=wasm;break;}}catch(e){console.warn('CDN MediaPipe no disponible',url,e);}}
    if(!library?.HandLandmarker||!library?.FilesetResolver)throw new Error('No se pudo cargar MediaPipe desde los servidores. Probá con GitHub Pages en HTTPS.');
    const {HandLandmarker,FilesetResolver}=library;
    const resolver=await FilesetResolver.forVisionTasks(wasmUrl);
    landmarker=await HandLandmarker.createFromOptions(resolver,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.55,minTrackingConfidence:.5});
    running=true;button.textContent='detener cámara';status.textContent='mostrá la mano y cruzá la línea con los dedos';tick();
  }catch(err){status.textContent='error: '+err.message;stop();}
  button.disabled=false;
}
function tick(){
  if(!running)return;
  if(video.readyState>=2 && video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    try{const result=landmarker.detectForVideo(video,performance.now());
      window.handBridge.update(result.landmarks?.[0]||null);
      status.textContent=result.landmarks?.length?(window.handBridge&&document.querySelector('#borde')?'mano detectada · cruzá el borde':'mano detectada'):'buscando mano…';
    }catch(err){status.textContent='seguimiento: '+err.message}
  }
  rafId=requestAnimationFrame(tick);
}
function stop(){running=false;cancelAnimationFrame(rafId);window.handBridge.stop();stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;button.textContent='activar cámara / mano';}
button.onclick=()=>{if(running){stop();status.textContent='cámara desactivada'}else start()};
addEventListener('pagehide',stop);
</script>
